<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:transparent;
padding:0;
}

.widget{
width:100%;
max-width:1400px;
margin:auto;
background:#832D51;
border:1px solid #cfdd9d;
border-radius:20px;
padding:16px 28px;
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
column-gap:40px;
}

.section{
display:flex;
flex-direction:column;
justify-content:center;
}

.center{
text-align:center;
}

.right{
text-align:right;
}

.greeting{
font-size:28px;
font-weight:700;
color:#FFF8E7;
margin-bottom:5px;
}

.date{
font-size:15px;
color:#F5EBD7;
}

.clock{
font-size:36px;
font-weight:700;
color:#FFF8E7;
letter-spacing:-1px;
line-height:1;
}

.quote{
font-size:15px;
font-weight:300;
color:#FFF8E7;
line-height:0.5;
}

@media(max-width:850px){

.widget{
grid-template-columns:1fr;
row-gap:16px;
text-align:center;
padding:18px;
}

.right{
text-align:center;
}

.clock{
font-size:26px;
}

.greeting{
font-size:24px;
}

}

</style>
</head>

<body>

<div class="widget">

<div class="section">
<div class="greeting" id="greeting"></div>
<div class="date" id="date"></div>
</div>

<div class="section center">
<div class="clock" id="time"></div>
</div>

<div class="section right">
<div class="quote" id="quote"></div>
</div>

</div>

<script>

const now=new Date();
const hour=now.getHours();

let greeting="";

if(hour<12){
greeting="Good Morning";
}
else if(hour<18){
greeting="Good Afternoon";
}
else if(hour<22){
greeting="Good Evening";
}
else{
greeting="Good Night";
}

document.getElementById("greeting").textContent=greeting;

document.getElementById("date").textContent=
now.toLocaleDateString("en-US",{
weekday:"long",
month:"long",
day:"numeric",
year:"numeric"
});


function updateClock(){

const n=new Date();

document.getElementById("time").textContent=
n.toLocaleTimeString("en-GB",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:false
});

}

updateClock();
setInterval(updateClock,1000);


const quotes = [

"The quiet days are part of the story too."
"Leave traces of what you loved."
"Keep making things, even when no one is watching."
"Maybe today doesn't have to be extraordinary."
"The smallest moments tend to stay the longest."
"Create a life that feels like yours."
"Follow what quietly pulls you in."
"One day, this ordinary afternoon will feel nostalgic."
"Curiosity will take you somewhere."
"Keep collecting little things that make you feel alive."
"Make things that feel like home."
"You'll remember how the light looked today."
"Stay curious about the life you're living."
"Take your time becoming."
"You are growing, even when it feels slow."
"There is still so much left to discover."
"Peace can be enough."
"You are living through memories in the making."
"The world feels bigger when you're paying attention."
"Keep a little wonder with you."
"Some answers arrive quietly."
"Romanticize the little moments."
"Trust the slow seasons."
"The future is built one quiet day at a time."
"Protect your creative energy."
"Let yourself begin again."
"Your curiosity knows the way."
"Life doesn't have to be loud to be meaningful."
"There is magic in ordinary days."
"Keep creating the life you'll look back on fondly."
"Ordinary days deserve to be remembered."
"Wonder is a way of paying attention."
"There is beauty in becoming."
"You don't need to rush this chapter."
"Be gentle with this season of your life."
"Look a little closer."
"Some places change you before you realize it."
"Growing up is mostly learning to stay with yourself."
"There is no timeline for becoming."
"You are allowed to change your mind."
"Not every beautiful day has to be memorable."

];

document.getElementById("quote").textContent=
"❝ "+quotes[now.getDate()%quotes.length];

</script>

</body>
</html>
